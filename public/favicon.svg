<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1f4e" />
      <stop offset="100%" stop-color="#0d0f2b" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark circular background -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" />

  <!-- Colorful ring border -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="16" />

  <!-- Letter "I" (intop style) -->
  <text
    x="192"
    y="340"
    font-family="Arial, sans-serif"
    font-size="260"
    font-weight="900"
    fill="url(#letterGrad)"
    filter="url(#glow)"
  >I</text>

  <!-- Arrow swoosh (bottom-left to top-right) -->
  <path
    d="M 140 370 Q 260 200 360 140"
    fill="none"
    stroke="url(#arrowGrad)"
    stroke-width="22"
    stroke-linecap="round"
  />
  <!-- Arrowhead -->
  <polygon
    points="360,140 320,145 340,178"
    fill="#fbbf24"
  />

  <!-- Crown on top of I -->
  <g transform="translate(198, 60)">
    <!-- Crown base -->
    <path d="M10 50 L110 50 L100 10 L60 35 L55 5 L10 50 Z" fill="url(#crownGrad)" />
    <!-- Crown gems -->
    <circle cx="55" cy="8" r="7" fill="#ef4444" />
    <circle cx="100" cy="12" r="5" fill="#3b82f6" />
    <circle cx="10" cy="12" r="5" fill="#22c55e" />
    <!-- Gold balls on crown tips -->
    <circle cx="55" cy="5" r="8" fill="#fbbf24" />
    <circle cx="100" cy="10" r="6" fill="#fbbf24" />
    <circle cx="10" cy="10" r="6" fill="#fbbf24" />
  </g>
</svg>
